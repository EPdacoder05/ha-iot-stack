services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.2.0
    container_name: homeassistant
    volumes:
      - ./homeassistant:/config
      - /var/run/dbus:/var/run/dbus:ro
      - /run/udev:/run/udev:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN      # Network management for mDNS/discovery
      - NET_RAW        # Raw socket access for BLE/network scanning
    cap_drop:
      - ALL            # Drop all capabilities first, then add back only what's needed
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0    # Zigbee/Z-Wave stick (if used)
      - /dev/ttyACM0:/dev/ttyACM0    # Serial devices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    volumes:
      - ./homeassistant/mosquitto/config:/mosquitto/config
      - ./homeassistant/mosquitto/data:/mosquitto/data
      - ./homeassistant/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: bridge
    environment:
      - MQTT_BROKER=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN      # Network management for BLE
      - NET_RAW        # Raw socket access for Bluetooth
    cap_drop:
      - ALL            # Drop all capabilities first, then add back only what's needed
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/hci0:/dev/hci0    # Bluetooth HCI device
    volumes:
      - ./homeassistant/secrets.yaml:/app/secrets.yaml:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /run/udev:/run/udev:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*bridge' || pgrep -f 'python.*mqtt' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
